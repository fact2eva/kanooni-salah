          const saved = localStorage.getItem('advocate_cases_data');

      // ==========================================

      const [showChangeCredsModal, setShowChangeCredsModal] = useState(false);

      // Current Active Session
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = sessionStorage.getItem('advocate_session_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) {
          return null;
        }
      });

      // Form inputs
      const [loginIdent, setLoginIdent] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [showPass, setShowPass] = useState(false);
      
      // Signup inputs
      const [signupName, setSignupName] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPass, setSignupPass] = useState('');
      const [signupPassConfirm, setSignupPassConfirm] = useState('');

      // Forgot / Recover Password
      const [forgotEmail, setForgotEmail] = useState('');

      // Change Password & ID inputs
      const [oldPass, setOldPass] = useState('');
      const [newIdent, setNewIdent] = useState('');
      const [newPass, setNewPass] = useState('');
      const [newPassConfirm, setNewPassConfirm] = useState('');

      // Status messages
      const [authMsg, setAuthMsg] = useState({ text: '', type: '' });

      // Persistent Vault Users
      const [vaultUsers, setVaultUsers] = useState(() => {
        try {
          const saved = localStorage.getItem('kanooni_vault_users');
          return saved ? JSON.parse(saved) : DEFAULT_VAULT_USERS;
        } catch(e) {
          return DEFAULT_VAULT_USERS;
        }
      });

      // New Case Form state
      const [newCase, setNewCase] = useState({
        caseNo: '',
        court: 'Delhi High Court - Court 14',
        client: '',
        opposite: '',
        nextDate: '',
        stage: 'Filing / Admission',
        type: 'Civil Writ'
      });

      // Consultation Form state
      const [consultForm, setConsultForm] = useState({
        name: '',
        phone: '',
        matterType: 'High Court Writ Petition (Art 226)',
        court: 'High Court of Delhi',
        urgency: 'Standard Listing',
        details: ''
      });

        if (sessionStorage.getItem('bci_disclaimer_accepted')) {
          setAccepted(true);
        }
      }, []);

      // Persist cases on update (Unlimited Free Storage)
      useEffect(() => {
        try {
          localStorage.setItem('advocate_cases_data', JSON.stringify(cases));
        } catch(e) {}

      // Persist Vault Users (Unlimited Free Storage)
      useEffect(() => {
        try {
          localStorage.setItem('kanooni_vault_users', JSON.stringify(vaultUsers));
        } catch(e) {}

      const handleAgree = () => {
        sessionStorage.setItem('bci_disclaimer_accepted', 'true');
        setAccepted(true);
      };

      // ==========================================
      // UNLIMITED FREE VAULT AUTHENTICATION
      // ==========================================

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setAuthMsg({ text: '', type: '' });

        const idTrim = loginIdent.trim().toLowerCase();
        const passTrim = loginPass.trim();

        const matched = vaultUsers.find(u => 
          (u.id.toLowerCase() === idTrim || u.email.toLowerCase() === idTrim) && 
          u.pass === passTrim
        );

        if (!matched) {
          setAuthMsg({ text: 'Invalid Advocate ID / Email or Password. Please try again.', type: 'error' });
          return;
        }

        const userObj = {
          id: matched.id,
          email: matched.email,
          name: matched.name,
          provider: 'unlimited_vault'
        };
        setCurrentUser(userObj);
        sessionStorage.setItem('advocate_session_user', JSON.stringify(userObj));
        setAuthMsg({ text: `Welcome back, ${matched.name}!`, type: 'success' });
      };

      const handleSignupSubmit = (e) => {
        e.preventDefault();
        setAuthMsg({ text: '', type: '' });
        
        if (signupPass !== signupPassConfirm) {
          setAuthMsg({ text: 'Passwords do not match.', type: 'error' });
          return;
        }
        if (signupPass.length < 4) {
          setAuthMsg({ text: 'Password must be at least 4 characters.', type: 'error' });
          return;
        }

        const emailTrim = signupEmail.trim();
        const exists = vaultUsers.find(u => u.email.toLowerCase() === emailTrim.toLowerCase() || u.id.toLowerCase() === emailTrim.toLowerCase());
        if (exists) {
          setAuthMsg({ text: 'An account with this ID or Email already exists.', type: 'error' });
          return;
        }

        const newUser = {
          id: emailTrim.split('@')[0] || emailTrim,
          email: emailTrim,
          name: signupName.trim() || 'Advocate',
          pass: signupPass
        };

        const updated = [...vaultUsers, newUser];
        setVaultUsers(updated);

        const userObj = {
          id: newUser.id,
          email: newUser.email,
          name: newUser.name,
          provider: 'unlimited_vault'
        };
        setCurrentUser(userObj);
        sessionStorage.setItem('advocate_session_user', JSON.stringify(userObj));
        setAuthMsg({ text: 'Account registered successfully! Logged in.', type: 'success' });
      };

      const handleForgotSubmit = (e) => {
        e.preventDefault();
        setAuthMsg({ text: '', type: '' });

        const searchTrim = forgotEmail.trim().toLowerCase();
        const found = vaultUsers.find(u => u.email.toLowerCase() === searchTrim || u.id.toLowerCase() === searchTrim);

        if (found) {
          setAuthMsg({ 
            text: `Account Verified! The current password for ${found.name} (${found.id}) is "${found.pass}". You can log in or change it anytime.`, 
            type: 'success' 
          });
        } else {
          setAuthMsg({ text: 'No registered account found with this ID or Email.', type: 'error' });
        }
      };

      // CHANGE ID & PASSWORD IN THE FUTURE (100% UNLIMITED & FREE)
      const handleChangeCredsSubmit = (e) => {
        e.preventDefault();
        setAuthMsg({ text: '', type: '' });

        if (newPass && newPass !== newPassConfirm) {
          setAuthMsg({ text: 'New Passwords do not match.', type: 'error' });
          return;
        }

        const userIdx = vaultUsers.findIndex(u => u.id === currentUser?.id || u.email === currentUser?.email);
        if (userIdx === -1) {
          setAuthMsg({ text: 'User profile not found.', type: 'error' });
          return;
        }

        if (vaultUsers[userIdx].pass !== oldPass) {
          setAuthMsg({ text: 'Current password does not match. Please verify your old password.', type: 'error' });
          return;
        }

        const updated = [...vaultUsers];
        if (newPass) updated[userIdx].pass = newPass;
        if (newIdent && newIdent.trim()) {
          const cleanIdent = newIdent.trim();
          updated[userIdx].id = cleanIdent.split('@')[0];
          updated[userIdx].email = cleanIdent;
        }
        setVaultUsers(updated);

        const newSession = {
          ...currentUser,
          id: updated[userIdx].id,
          email: updated[userIdx].email
        };
        setCurrentUser(newSession);
        sessionStorage.setItem('advocate_session_user', JSON.stringify(newSession));

        setAuthMsg({ text: 'Credentials updated successfully in Secure Vault!', type: 'success' });
        setShowChangeCredsModal(false);
        setOldPass('');
        setNewPass('');
        setNewPassConfirm('');
        setNewIdent('');
      };

        setCurrentUser(null);
        sessionStorage.removeItem('advocate_session_user');
        setView('public');

      // ==========================================

          setCases(cases.filter(c => c.id !== id));

        setShowConsultModal(false);
      };

      // Filtered cases

        return cases.filter(c => {
          const matchQuery = 
            c.caseNo.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.client.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.court.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (c.opposite && c.opposite.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (c.stage && c.stage.toLowerCase().includes(searchQuery.toLowerCase()));

          if (!matchQuery) return false;
          if (courtFilter === 'ALL') return true;
          if (courtFilter === 'HC') return c.court.toLowerCase().includes('high court');
          if (courtFilter === 'SC') return c.court.toLowerCase().includes('supreme court');
          if (courtFilter === 'DISTRICT') return !c.court.toLowerCase().includes('high court') && !c.court.toLowerCase().includes('supreme court');
          return true;
        });
      }, [cases, searchQuery, courtFilter]);

        if (!converterSearch.trim()) return LAW_CONVERTER_DATA;
        const q = converterSearch.toLowerCase();
        return LAW_CONVERTER_DATA.filter(item => 
          item.oldAct.toLowerCase().includes(q) ||
          item.oldName.toLowerCase().includes(q) ||
          item.newAct.toLowerCase().includes(q) ||
          item.newDetails.toLowerCase().includes(q)

                      type="text" 
                      placeholder={currentUser?.email || currentUser?.id || "Leave blank to keep unchanged"}
                      value={newIdent}
                      onChange={(e) => setNewIdent(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500 font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">New Password</label>
                    <input 
                      type="password" 
                      placeholder="Enter new password (min 4 characters)"
                      value={newPass}
                      onChange={(e) => setNewPass(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500 font-mono"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Confirm New Password</label>

                      type="password" 
                      placeholder="Confirm new password"
                      value={newPassConfirm}

                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">

                      type="button" 
                      onClick={() => setShowChangeCredsModal(false)}

                </div>
              </div>

                <p className="text-xs text-slate-400">Request a privileged consultation at Advocate Asif Ali's High Court / Chamber desk.</p>
                
                <form onSubmit={handleConsultSubmit} className="space-y-3.5 text-xs">

                      type="text" 
                      required
                      placeholder="e.g. Rajesh Kumar" 
                      value={consultForm.name}
                      onChange={(e) => setConsultForm({...consultForm, name: e.target.value})}
                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                    />
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                        type="text" 
                        required
                        placeholder="+91 9876543210"

                    <div>

                      >
                        <option>Urgent Bail / Hearing</option>
                        <option>Standard Listing</option>
                        <option>Legal Advisory / Drafting</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Matter Category</label>
                      <select 
                        value={consultForm.matterType}
                        onChange={(e) => setConsultForm({...consultForm, matterType: e.target.value})}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500"

                        <option>High Court Writ Petition (Art 226)</option>

                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Preferred Court</label>
                      <select 
                        value={consultForm.court}

                        <option>Supreme Court of India</option>
                        <option>Patiala House Courts</option>
                        <option>Tis Hazari Courts</option>
                        <option>Saket District Courts</option>
                        <option>Rouse Avenue Courts</option>
                        <option>NCLT / NCLAT</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Brief Description of Legal Matter</label>

                      rows="3"

                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500"

                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setShowConsultModal(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs">

                    <button 
                      type="submit"
                      className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/20"
                    >
                      <i className="fa-brands fa-whatsapp text-sm"></i>
                      <span>Send to Advocate Asif Ali (+91 9910262785)</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

              <form onSubmit={handleAddCase} className="max-w-md w-full bg-slate-900 border-2 border-amber-500/40 rounded-3xl p-6 sm:p-8 space-y-4 text-slate-200">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-serif font-bold text-amber-400">Add New Cause List Record</h3>
                  <button type="button" onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-100 w-8 h-8 rounded-full bg-slate-950 flex items-center justify-center border border-slate-800">
                    <i className="fa-solid fa-xmark text-sm"></i>
                  </button>
                </div>
                
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 mb-1">Case Number *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. W.P.(C) 5510/2026" 
                      value={newCase.caseNo}
                      onChange={(e) => setNewCase({...newCase, caseNo: e.target.value})}
                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500 font-mono" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 mb-1">Court Forum *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="e.g. High Court of Delhi - Court 16" 
                      value={newCase.court}
                      onChange={(e) => setNewCase({...newCase, court: e.target.value})}
                      className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1">Client Name *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Client Name" 
                        value={newCase.client}
                        onChange={(e) => setNewCase({...newCase, client: e.target.value})}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">Opposite Party</label>
                      <input 
                        type="text" 
                        placeholder="Opposite Party" 
                        value={newCase.opposite}
                        onChange={(e) => setNewCase({...newCase, opposite: e.target.value})}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 mb-1">Next Hearing Date</label>
                      <input 
                        type="date" 
                        value={newCase.nextDate}
                        onChange={(e) => setNewCase({...newCase, nextDate: e.target.value})}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 mb-1">Case Stage</label>
                      <input 
                        type="text" 
                        placeholder="Stage / Hearing" 
                        value={newCase.stage}
                        onChange={(e) => setNewCase({...newCase, stage: e.target.value})}
                        className="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:outline-none focus:border-amber-500" 
                      />
                    </div>
                  </div>
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Cancel</button>
                  <button type="submit" className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">Save Case Entry</button>
                </div>
              </form>
            </div>
          )}

          {/* FOOTER SECTION */}
          <footer className="bg-[#04070a] border-t border-slate-800/80 px-4 sm:px-8 py-12 text-center text-xs text-slate-400 space-y-5 mt-auto">
            <div className="max-w-7xl mx-auto space-y-4">
              
              <div className="flex flex-wrap justify-center items-center gap-4 text-slate-300 text-xs sm:text-sm">
                <span className="font-serif font-bold text-amber-400">Kanooni Salah</span>
                <span>•</span>
                <span>Advocate Asif Ali</span>
                <span>•</span>
                <span>High Court of Delhi</span>
                <span>•</span>

              <p className="text-[11px] text-slate-500 max-w-3xl mx-auto leading-relaxed">
                Bar Council of India Rule 36 Compliant. The content on this website is for informational reference regarding Indian statutory laws (BNS, BNSS, BSA 2023) and High Court procedures. Access does not constitute legal solicitation or advocate-client relationship.
              </p>

              {/* CREATIVE INTELIGENCE ATTRIBUTION BADGE (SUDHIR KUMAR SOLANKI) */}

                <button 
                  onClick={() => setShowSudhirModal(true)}

                  <span className="text-xs font-mono font-medium tracking-wide bg-gradient-to-r from-amber-300 via-amber-100 to-amber-400 bg-clip-text text-transparent">

                </button>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
